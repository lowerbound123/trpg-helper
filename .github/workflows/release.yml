name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish as a draft release
        required: true
        default: v1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      SEGMENTATION_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify requested tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git rev-parse "refs/tags/${RELEASE_TAG}"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm run check:release
      - name: Run frontend tests
        run: pnpm exec vitest run
      - name: Typecheck frontend
        run: pnpm run typecheck
      - name: Prepare pinned ONNX Runtime
        run: pnpm prepare:segmentation-resources -- --target ${{ matrix.target }}
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: TRPG Helper ${{ env.RELEASE_TAG }}
          releaseBody: |
            See CHANGELOG.md for the 1.0 release notes.

            These packages are not commercially code-signed or notarized. macOS and Windows may display publisher warnings; follow the repository README without disabling system security globally.

            Supported targets: macOS Apple Silicon, Windows x86_64, and Linux x86_64.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][_setup][ext]'
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
