# Handout Generator local configuration.
# Values here are read by the Vue/Tauri app at build time unless noted otherwise.

schema_version = 1

[application]
title = "Handout Generator"

[window]
width = 1440
height = 920
min_width = 1180
min_height = 760
resizable = true

[diagnostics]
log_directory = "./logs"

[paths]
data_dir = "./data"
log_file = "./logs/app.log"

[uploads]
max_file_size = "100mb"

[previews]
thumbnail_max_edge_px = 256
thumbnail_quality = 80
target_max_bytes = 524288

[finder]
manager_height_px = 1080
compact_height_px = 300
handout_grid_scale = 2
background_grid_scale = 2

[editor]
snap_threshold_screen_px = 5
max_snap_candidates = 24
continuous_edit_commit_delay_ms = 450

[mask]
# Set to false to disable all layer mask UI, editing, preview composition,
# project preview masks, and export/flat mask application.
enabled = true
# Use PixiJS for low-frequency layer mask preview composition. Final export
# still uses the Canvas2D/Konva path so the output is deterministic.
use_pixi_preview = true
# Minimum opacity used only for in-progress brush/eraser stroke previews while
# editing a mask. Final mask pixels still use the configured brush/eraser value.
stroke_preview_min_opacity = 0.3
# Delay secondary mask preview work after brush/eraser/shape edits. Target layer
# recomposition starts on the next frame.
interactive_refresh_delay_ms = 1000
# Keep secondary/full mask recomposition out of pointer down/drag hot paths.
pointer_idle_grace_ms = 120

[export]
default_scale = 1
min_scale = 0.1
raw_rgba_ipc_max_bytes = 134217728

[export.defaults]
format = "png"
png_optimization_level = 3
png_optimize_alpha = true
png_preserve_metadata = false
png_zopfli = false
jpeg_quality = 85
jpeg_progressive = true
jpeg_deringing = true
jpeg_chroma_subsampling = "422"
webp_quality = 90
webp_lossless = false
webp_encoding_strength = "balanced"
jxl_lossless = false
jxl_distance = 1.0
jxl_effort = 7
jxl_progressive = true
jxl_decoding_speed = 0

[export.limits]
png_optimization_level_min = 0
png_optimization_level_max = 6
jpeg_quality_min = 1
jpeg_quality_max = 100
webp_quality_min = 1
webp_quality_max = 100
jxl_distance_min = 0.0
jxl_distance_max = 5.0
jxl_effort_min = 1
jxl_effort_max = 9
jxl_decoding_speed_min = 0
jxl_decoding_speed_max = 4
max_canvas_dimension = 16384
max_canvas_pixels = 67108864

[export.rendering]
jpeg_matte_color = "#FFFFFFFF"

[[export.webp_strength_profiles]]
id = "fast"
label = "快速"
method = 2
passes = 1

[[export.webp_strength_profiles]]
id = "balanced"
label = "均衡"
method = 4
passes = 2

[[export.webp_strength_profiles]]
id = "strong"
label = "高压缩"
method = 5
passes = 6

[[export.webp_strength_profiles]]
id = "maximum"
label = "极限"
method = 6
passes = 10

[debug]
file_log_enabled = true
render_perf_log_enabled = true

[token.defaults]
design_size = 512
scale = 100
offset_x = 0
offset_y = 0
background_color = "#000000FF"
ring_inner_radius = 225
ring_outer_radius = 250
ring_color = "#F6C75BFF"
ring_style = "solid"
ring_stretch_x = 1.0
ring_stretch_y = 1.0
split_ring = false
split_angle = 0
split_height = 0

[token.limits]
scale_min = 10
scale_max = 500
scale_step = 5
offset_min = -100
offset_max = 100
ring_stretch_min = 0.01
ring_stretch_max = 4.0
split_angle_min = 0
split_angle_max = 359
split_height_min = -100
split_height_max = 100

[token.export.defaults]
format = "png"
size = 512
png_optimization_level = 3
png_optimize_alpha = true
png_preserve_metadata = false
png_zopfli = false
jpeg_quality = 85
jpeg_progressive = true
jpeg_deringing = true
jpeg_chroma_subsampling = "422"
webp_quality = 90
webp_lossless = false
webp_encoding_strength = "balanced"
jxl_lossless = false
jxl_distance = 1.0
jxl_effort = 7
jxl_progressive = true
jxl_decoding_speed = 0
random_background = false
random_ring_color = false

[token.export.limits]
size_min = 64
size_max = 2048
png_optimization_level_min = 0
png_optimization_level_max = 6
jpeg_quality_min = 1
jpeg_quality_max = 100
webp_quality_min = 1
webp_quality_max = 100
jxl_distance_min = 0.0
jxl_distance_max = 5.0
jxl_effort_min = 1
jxl_effort_max = 9
jxl_decoding_speed_min = 0
jxl_decoding_speed_max = 4
max_canvas_size = 4096

[token.export.rendering]
resample_filter = "lanczos3"
trim_transparent_bounds = true
jpeg_matte_color = "#FFFFFFFF"

[token.export.naming]
collision_separator = "_"
collision_start = 2

[token.export.random_colors]
palette = ["#0B1020", "#102A43", "#3B0A57", "#5A0B2E", "#5B1A00", "#064E3B", "#164E63", "#3F3F46", "#F8FAFC", "#FFF3BF", "#FFD166", "#FF8FAB", "#FF6B6B", "#C4B5FD", "#7DD3FC", "#5EEAD4", "#86EFAC", "#FDE68A"]
minimum_contrast_ratio = 4.5
minimum_oklab_distance = 0.12

[[token.export.webp_strength_profiles]]
id = "fast"
label = "快速"
method = 2
passes = 1

[[token.export.webp_strength_profiles]]
id = "balanced"
label = "均衡"
method = 4
passes = 2

[[token.export.webp_strength_profiles]]
id = "strong"
label = "高压缩"
method = 5
passes = 6

[[token.export.webp_strength_profiles]]
id = "maximum"
label = "极限"
method = 6
passes = 10

[token.preview]
display_token_size = 400
minimum_world_size = 512
world_size_step = 128
renderer = "webgl"
antialias = true
device_pixel_ratio_max = 2.0

[token.preview.guide]
dash_length = 6
gap_length = 4
line_width = 1
line_color = "#FFFFFF"
line_alpha = 0.5
endpoint_radius = 3
endpoint_alpha = 0.7

[token.layout]
left_width = 280
right_width = 400
left_min_width = 200
center_min_width = 400
right_min_width = 300
resize_handle_width = 4

[token.files]
thumbnail_size = 56
import_formats = ["png", "jpg", "jpeg", "webp", "bmp"]
export_formats = ["png", "jpg", "webp", "jxl"]

[token.history]
maximum_entries = 50

[token.rings]
thumbnail_size = 64
request_debounce_ms = 50
frontend_cache_entries = 32
backend_cache_entries = 64
max_upload_bytes = 33554432
max_source_dimension = 16384
custom_scale_min = 10
custom_scale_max = 500

[token.notifications]
toast_duration_ms = 3000
