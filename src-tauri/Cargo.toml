[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = "0.40.1"
thiserror = "2.0.18"
base64 = "0.22.1"
image = "0.25.6"
webp = "0.3.1"
jpegxl-rs = { version = "0.15.0", default-features = false, features = ["vendored"] }
jpegxl-sys = "0.13.0"
mozjpeg-rs = "0.9.2"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel", "zopfli"] }
rand = "0.9.2"
resvg = "0.47.0"
tiny-skia = "0.12.0"
toml = "0.9.8"
usvg = "0.47.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
