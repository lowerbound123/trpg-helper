[package]
name = "trpg-helper"
version = "1.0.0"
description = "A local-first desktop editor for TRPG handouts and tokens"
authors = ["Tony Chow"]
license = "GPL-3.0-only"
repository = "https://github.com/lowerbound123/trpg-helper"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "trpg_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = "0.40.1"
thiserror = "2.0.18"
base64 = "0.22.1"
image = "0.25.6"
ndarray = "0.16.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
webp = "0.3.1"
jpegxl-rs = { version = "0.15.0", default-features = false, features = ["vendored"] }
jpegxl-sys = "0.13.0"
mozjpeg-rs = "0.9.2"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel", "zopfli"] }
rand = "0.9.2"
rayon = "1.11.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
resvg = "0.47.0"
sha2 = "0.10.9"
hex = "0.4.3"
tiny-skia = "0.12.0"
toml = "0.9.8"
usvg = "0.47.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-image = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-ml = { version = "0.3.2", features = [
  "MLDictionaryFeatureProvider",
  "MLFeatureProvider",
  "MLFeatureValue",
  "MLModel",
  "MLModelConfiguration",
  "MLMultiArray",
] }
objc2-vision = "0.3.2"
